services:

  rabbit:
    image: rabbitmq:4.0.2-management
    # image: rabbitmq:4.0.2
    container_name: rabbit
    hostname: rabbithost
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit_user
      - RABBITMQ_DEFAULT_PASS=rabbit_password
      - RABBITMQ_LOG_LEVEL=error
      - RABBITMQ_LOGS="-"
    restart: always
    volumes:
      - rabbit_data:/var/lib/rabbitmq/mnesia/

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: 'minio_user'
      MINIO_ROOT_PASSWORD: 'minio_password'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    restart: always
    volumes:
      - minio_data:/data
    command: minio server /data --address "0.0.0.0:9000" --console-address ":9001"

  minio-mc:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: minio-mc
    depends_on:
      - minio
    restart: no
    volumes:
      # - ./fixtures/minio_initialize_and_seed.sh:/docker-entrypoint-initdb.d/minio_import.sh
      - ./fixtures/minio_initialize.sh:/docker-entrypoint-initdb.d/minio_import.sh
      - ./fixtures/SampleVideo_1280x720_1mb.mp4:/tmp/videos/5d9e690ad76fe06a3d7ae416
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/minio_import.sh"]

  minio-storage:
    image: minio-storage
    build: 
      context: ./Flixtube.MinioStorage
      dockerfile: Dockerfile-dev
    container_name: video-storage
    ports:
     - 4060:80
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FLIXTUBE_MINIO_STORAGE_PORT=80
      - FLIXTUBE_STORAGE_ENDPOINT=minio:9000
      - FLIXTUBE_STORAGE_ACCESS_KEY=Y42xk0CJlYV2fnShCtBP
      - FLIXTUBE_STORAGE_SECRET_KEY=kCA01XftotivPbU9TRJ5Nrr5VMjFZNEhQhtvfWyY
      - FLIXTUBE_STORAGE_BUCKET_NAME=videos
    depends_on:
      - minio
    restart: always
    volumes:
      - ./Flixtube.MinioStorage:/src
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./Flixtube.MinioStorage
    #       target: /src

  # azure-storage:
  #   image: azure-storage
  #   build: 
  #     context: ./Flixtube.AzureStorage
  #     dockerfile: Dockerfile-dev
  #   container_name: video-storage
  #   ports:
  #    - 4060:80
  #   environment:
  #     - FLIXTUBE_AZURE_STORAGE_PORT=80
  #     # - FLIXTUBE_STORAGE_ACCOUNT_NAME=${FLIXTUBE_STORAGE_ACCOUNT_NAME}
  #     # - FLIXTUBE_STORAGE_ACCESS_KEY=${FLIXTUBE_STORAGE_ACCESS_KEY}
  #     - FLIXTUBE_STORAGE_ACCOUNT_NAME=name
  #     - FLIXTUBE_STORAGE_ACCESS_KEY=key
  #     - FLIXTUBE_STORAGE_CONTAINER_NAME=videos
  #   restart: always
  #   volumes:
  #     - ./Flixtube.AzureStorage:/src
  #   # develop:
  #   #   watch:
  #   #     - action: sync
  #   #       path: ./Flixtube.AzureStorage
  #   #       target: /src

  video-streaming:
    image: video-streaming
    build: 
      context: ./Flixtube.VideoStreaming
      dockerfile: Dockerfile-dev
    container_name: video-streaming
    ports:
     - 4040:80
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - FLIXTUBE_VIDEO_STREAMING_PORT=80
      - FLIXTUBE_VIDEO_STORAGE_SCHEME=http
      - FLIXTUBE_VIDEO_STORAGE_HOST=video-storage
      - FLIXTUBE_VIDEO_STORAGE_PORT=80
      - FLIXTUBE_RABBIT_MQ_HOST=amqp://rabbit_user:rabbit_password@rabbit:5672
    depends_on:
      - rabbit
      - minio-storage
      # - azure-storage
    restart: always
    volumes:
      - ./Flixtube.VideoStreaming:/src
