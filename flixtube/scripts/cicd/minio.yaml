#
# To deploy:
#
# kubectl apply -f scripts/deploy.yaml
#
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-12-18T13-15-44Z
        imagePullPolicy: Always
        command: ["minio", "server", "/data", "--address", "0.0.0.0:9000", "--console-address", ":9001"]
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: MINIO_ROOT_USER
          value: minio_user
        - name: MINIO_ROOT_PASSWORD
          value: minio_password
        - name: MINIO_ADDRESS
          value: :9000
        - name: MINIO_CONSOLE_ADDRESS
          value: :9001
        - name: MINIO_BUCKETS
          value: "videos"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 9000
      targetPort: 9000
    - name: dashboard
      protocol: TCP
      port: 9001
      targetPort: 9001
---
apiVersion: batch/v1
kind: Job
metadata:  
  name: minio-mc
spec:  
  template:
    spec: 
      containers: 
      - name: minio-mc 
        image: minio/mc:RELEASE.2024-11-21T17-21-54Z
        command:
            - /bin/sh
            - -c
            - |
              while [ ! $(mc alias set minio http://minio:9000 minio_user minio_password) ]
              do
                echo 'Waiting for minio to start up ...'
                sleep 0.1
              done
              sleep 5
              mc alias set minio http://minio:9000 minio_user minio_password && \
              mc mb minio/videos && \
              mc policy set public minio/videos && \
              mc anonymous set public minio/videos && \
              mc admin user add minio Y42xk0CJlYV2fnShCtBP kCA01XftotivPbU9TRJ5Nrr5VMjFZNEhQhtvfWyY && \
              mc admin policy attach minio readwrite --user Y42xk0CJlYV2fnShCtBP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: MINIO_ROOT_USER
          value: minio_user
        - name: MINIO_ROOT_PASSWORD
          value: minio_password
      restartPolicy: Never