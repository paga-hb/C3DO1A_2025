#
# To deploy:
#
# kubectl apply -f scripts/deploy.yaml
#
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-storage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-storage
  template:
    metadata:
      labels:
        app: video-storage
    spec:
      containers: 
      - name: video-storage
        image: video-storage:1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: FLIXTUBE_MINIO_STORAGE_PORT
          value: "4060"
        - name: FLIXTUBE_STORAGE_ENDPOINT
          value: minio:9000
        - name: FLIXTUBE_STORAGE_ACCESS_KEY
          value: Y42xk0CJlYV2fnShCtBP
        - name: FLIXTUBE_STORAGE_SECRET_KEY
          value: kCA01XftotivPbU9TRJ5Nrr5VMjFZNEhQhtvfWyY
        - name: FLIXTUBE_STORAGE_BUCKET_NAME
          value: videos
        # - name: FLIXTUBE_AZURE_STORAGE_PORT
        #   value: "4060"
        # - name: FLIXTUBE_STORAGE_ACCOUNT_NAME
        #   value: $AZURE_STORAGE_ACCOUNT_NAME
        # - name: FLIXTUBE_STORAGE_ACCESS_KEY
        #   value: $AZURE_STORAGE_ACCOUNT_KEY
        # - name: FLIXTUBE_STORAGE_CONTAINER_NAME
        #   value: videos
        ports:
        - containerPort: 4060
---
apiVersion: v1
kind: Service
metadata:
  name: video-storage
spec:
  selector:
    app: video-storage
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 4060
      targetPort: 4060