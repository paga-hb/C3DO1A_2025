#
# To deploy:
#
# kubectl apply -f scripts/deploy.yaml
#
#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-upload
spec:
  replicas: 1
  selector:
    matchLabels:
      app: video-upload
  template:
    metadata:
      labels:
        app: video-upload
    spec:
      containers: 
      - name: video-upload
        image: video-upload:1
        imagePullPolicy: Never
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: FLIXTUBE_VIDEO_UPLOAD_PORT
          value: "4050"
        - name: FLIXTUBE_VIDEO_STORAGE_SCHEME
          value: http
        - name: FLIXTUBE_VIDEO_STORAGE_HOST
          value: video-storage
        - name: FLIXTUBE_VIDEO_STORAGE_PORT
          value: "4060"
        - name: FLIXTUBE_RABBIT_MQ_HOST
          value: amqp://rabbit_user:rabbit_password@rabbit:5672
        ports:
        - containerPort: 4050
---
apiVersion: v1
kind: Service
metadata:
  name: video-upload
spec:
  selector:
    app: video-upload
  type: ClusterIP
  ports:
    - protocol: TCP
      port: 4050
      targetPort: 4050
