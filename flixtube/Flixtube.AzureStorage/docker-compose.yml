services:

  azure-storage:
    image: azure-storage
    build: 
      context: ./
      dockerfile: Dockerfile-dev
    container_name: video-storage
    ports:
     - 4060:80
    environment:
      - FLIXTUBE_AZURE_STORAGE_PORT=80
      - FLIXTUBE_STORAGE_ACCOUNT_NAME=sapagahb
      # - FLIXTUBE_STORAGE_ACCESS_KEY=${STORAGE_ACCESS_KEY}
      - FLIXTUBE_STORAGE_ACCESS_KEY=somekey
      - FLIXTUBE_STORAGE_CONTAINER_NAME=videos
    restart: always
    volumes:
      - ./:/src
