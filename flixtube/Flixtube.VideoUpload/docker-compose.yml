services:

  rabbit:
    image: rabbitmq:4.0.2-management
    # image: rabbitmq:4.0.2
    container_name: rabbit
    hostname: rabbithost
    ports:
      - 5672:5672
      - 15672:15672
    environment:
      - RABBITMQ_DEFAULT_USER=rabbit_user
      - RABBITMQ_DEFAULT_PASS=rabbit_password
      - RABBITMQ_LOG_LEVEL=error
      - RABBITMQ_LOGS="-"
    restart: always
    volumes:
      - rabbit_data:/var/lib/rabbitmq/mnesia/

  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    container_name: minio
    ports:
      - 9000:9000
      - 9001:9001
    environment:
      MINIO_ROOT_USER: 'minio_user'
      MINIO_ROOT_PASSWORD: 'minio_password'
      MINIO_ADDRESS: ':9000'
      MINIO_CONSOLE_ADDRESS: ':9001'
    restart: always
    volumes:
      - minio_data:/data
    command: minio server /data --address "0.0.0.0:9000" --console-address ":9001"

  minio-mc:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    container_name: minio-mc
    depends_on:
      - minio
    restart: no
    volumes:
      - ./fixtures/minio_initialize.sh:/docker-entrypoint-initdb.d/minio_import.sh
    entrypoint: ["bash", "/docker-entrypoint-initdb.d/minio_import.sh"]

  minio-storage:
    image: minio-storage
    build: 
      context: ../Flixtube.MinioStorage
      dockerfile: Dockerfile-dev
    container_name: video-storage
    ports:
     - 4060:80
    environment:
      - FLIXTUBE_MINIO_STORAGE_PORT=80
      - FLIXTUBE_STORAGE_ENDPOINT=minio:9000
      - FLIXTUBE_STORAGE_ACCESS_KEY=Y42xk0CJlYV2fnShCtBP
      - FLIXTUBE_STORAGE_SECRET_KEY=kCA01XftotivPbU9TRJ5Nrr5VMjFZNEhQhtvfWyY
      - FLIXTUBE_STORAGE_BUCKET_NAME=videos
    depends_on:
      - minio
    restart: always
    volumes:
      - ./:/src
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./Flixtube.MinioStorage
    #       target: /src

  video-upload:
    image: video-upload
    build: 
      context: ./
      dockerfile: Dockerfile-dev
    container_name: video-upload
    ports:
     - 4050:80
    environment:
      - FLIXTUBE_VIDEO_UPLOAD_PORT=80
      - FLIXTUBE_VIDEO_STORAGE_SCHEME=http
      - FLIXTUBE_VIDEO_STORAGE_HOST=video-storage
      - FLIXTUBE_VIDEO_STORAGE_PORT=80
      - FLIXTUBE_RABBIT_MQ_HOST=amqp://rabbit_user:rabbit_password@rabbit:5672
    depends_on:
      - rabbit
      - minio-storage
    restart: always
    volumes:
      - ./:/src
    # develop:
    #   watch:
    #     - action: sync
    #       path: ./Flixtube.VideoUpload
    #       target: /src

volumes:
  rabbit_data:
    driver: local
  minio_data:
    driver: local